{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<h1 class="h3 mb-3">Log in</h1>
<form method="post" class="card card-body">
 {{ csrf_field() }}
 <div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" type="email" name="email" class="form-control" required maxlength="150" autocomplete="username"></div>
 <div class="mb-3"><label class="form-label" for="password">Password</label><input id="password" type="password" name="password" class="form-control" required maxlength="128" autocomplete="current-password"></div>
 <button class="btn btn-brand">Log in</button>
</form>
<p class="mt-3">New here? <a href="{{ url_for('register') }}">Create an account</a>.</p>
</div></div>
{% endblock %}

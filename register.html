{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
<h1 class="h3 mb-3">Create your account</h1>
<form method="post" class="card card-body">
 {{ csrf_field() }}
 {% set s = request.form %}
 <div class="mb-3">
  <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="role" id="r1" value="customer" {{ 'checked' if s.get('role') != 'owner' }}><label class="form-check-label" for="r1">I am a customer</label></div>
  <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="role" id="r2" value="owner" {{ 'checked' if s.get('role') == 'owner' }}><label class="form-check-label" for="r2">I own a shop</label></div>
 </div>
 <div class="row g-2 mb-3">
  <div class="col-md-6"><label class="form-label" for="name">Your name</label><input id="name" name="name" class="form-control" maxlength="100" required value="{{ s.get('name') or '' }}"></div>
  <div class="col-md-6"><label class="form-label" for="email">Email</label><input id="email" type="email" name="email" class="form-control" maxlength="150" required value="{{ s.get('email') or '' }}"></div>
  <div class="col-md-6"><label class="form-label" for="password">Password (8+ characters)</label><input id="password" type="password" name="password" class="form-control" minlength="8" maxlength="128" required autocomplete="new-password"></div>
  <div class="col-md-6"><label class="form-label" for="confirm">Repeat password</label><input id="confirm" type="password" name="confirm" class="form-control" minlength="8" maxlength="128" required autocomplete="new-password"></div>
 </div>
 <div id="shopbox" class="border-top pt-3 mb-3"><h2 class="h6">Shop details</h2>{% include "shop_fields.html" %}</div>
 <button class="btn btn-brand align-self-start">Create account</button>
</form>
</div></div>
{% endblock %}
{% block scripts %}
<script>
(function(){
 var box=document.getElementById('shopbox'),radios=document.querySelectorAll('input[name=role]');
 function sync(){var owner=document.getElementById('r2').checked;box.hidden=!owner;}
 radios.forEach(function(r){r.addEventListener('change',sync);});sync();
})();
</script>
{% endblock %}
